<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateful</title>
<meta name="description" content="Plateful prototype, editorial market system. Calgary flyers in, fridge in, ranked recipes out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Plateful — editorial market system (NYT Cooking cues, 2026-10-26)
   Layout: a 390×844 phone artboard on a quiet stage; white ground, ink type,
   one terracotta accent, photos square-cornered, sections opened by a 2 px ink rule. */
:root{
  --ground:#FFFFFF;--paper:#FAF8F5;--ink:#1A1511;--text:#2B2521;--muted:#6B625B;--faint:#9A9087;
  --hair:#E8E2DA;--input:#D9D2C9;--acc:#B4552E;--acc-hover:#9A4525;--acc-tint:#E8A07A;--tint:#F7ECE5;
  --stage:#F1EDE7;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
img{max-width:100%;display:block}
a{color:var(--acc);text-decoration:none}

/* ---- stage + phone ---- */
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:390px;height:844px;background:var(--ground);border:1px solid var(--hair);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--hair)}
.stage-note{position:fixed;left:0;right:0;bottom:0;text-align:center;font:500 12px var(--sans);color:var(--faint);padding:10px;pointer-events:none}
@media (max-width:460px){.stage{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0}.stage-note{display:none}}

/* ---- phone chrome ---- */
.status{flex:none;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;font:600 14px var(--sans);color:var(--ink);background:var(--ground)}
.status.dark{background:var(--ink);color:#fff}
.status svg{width:18px;height:18px}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;background:var(--ground)}
.screen.dark{background:var(--ink);color:#fff}
.tabbar{flex:none;height:84px;border-top:1px solid var(--hair);background:var(--ground);display:flex;padding:9px 8px 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11px var(--sans);color:var(--muted);letter-spacing:.01em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--acc);font-weight:600}

/* ---- type ---- */
.eyebrow{font:700 11px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink)}
.eyebrow.acc{color:var(--acc)}
.eyebrow.mut{color:var(--muted)}
.lead-title{font:500 28px/1.12 var(--serif);letter-spacing:-.01em;color:var(--ink);text-wrap:balance;margin:0}
.h-serif{font:500 24px/1.15 var(--serif);letter-spacing:-.01em;color:var(--ink);margin:0;text-wrap:balance}
.screen-title{font:500 28px/1.1 var(--serif);letter-spacing:-.01em;color:var(--ink);margin:0}
.dek{font:400 15px/1.45 var(--serif);color:var(--text);margin:0}
.card-title{font:700 16px/1.25 var(--sans);color:var(--ink);margin:0}
.meta{font:400 13px/1.4 var(--sans);color:var(--muted)}
.meta b{font-weight:600;color:var(--text)}
.price{font:600 16px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.was{color:var(--muted);text-decoration:line-through;font:400 13px var(--sans)}
.off{color:var(--acc);font:600 13px var(--sans)}
.stars{font-size:12px;letter-spacing:.04em;color:var(--ink)}
.byline{font:400 14px/1.4 var(--serif);color:var(--text)}
.byline u,.byline a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--input)}
.status-line{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.status-line .st{color:var(--acc)}
.pad{padding-left:22px;padding-right:22px}
.hidden{display:none!important}

/* ---- topbar ---- */
.topbar{position:sticky;top:0;z-index:6;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 22px 10px;min-height:48px}
.topbar.lined{border-bottom:1px solid var(--hair)}
.wordmark{display:flex;align-items:center;gap:8px;font:700 22px var(--serif);color:var(--ink);letter-spacing:-.01em}
.wordmark svg{width:26px;height:26px}
.locchip{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sans);color:var(--ink);border:1px solid var(--input);border-radius:16px;padding:6px 10px;white-space:nowrap}
.locchip svg{width:14px;height:14px}
.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.onphoto{background:#fff;width:36px;height:36px}
.iconbtn.onphoto svg{width:18px;height:18px}

/* ---- search (NYT-style) ---- */
.search{position:relative;display:flex;align-items:center;height:50px;border:1px solid var(--input);border-radius:4px;background:var(--ground);padding:0 14px;gap:10px;margin:4px 0 14px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:400 16px var(--sans);color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted)}
.search .camb{width:36px;height:36px;margin-right:-8px;display:flex;align-items:center;justify-content:center;color:var(--acc);border-left:1px solid var(--hair);padding-left:8px;border-radius:0}
.search .camb svg{color:var(--acc);width:22px;height:22px}
.sresults{border:1px solid var(--hair);border-radius:4px;margin:-8px 0 16px;background:var(--ground)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--hair);width:100%}
.srow:last-child{border-bottom:0}
.srow img{width:52px;height:52px;object-fit:cover;border-radius:2px;flex:none;background:var(--paper)}
.srow .t{font:600 14px/1.25 var(--sans);color:var(--ink)}
.srow .m{font:400 12px var(--sans);color:var(--muted)}
.srow.add{color:var(--acc);font-weight:600;font-size:14px}
.srow svg{width:18px;height:18px;flex:none}

/* ---- text tabs / chips ---- */
.ttabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;margin-bottom:6px}
.ttabs::-webkit-scrollbar{display:none}
.ttab{flex:none;font:600 14px var(--sans);color:var(--ink);padding:7px 10px;border-radius:4px;white-space:nowrap}
.ttab.on{background:var(--tint)}
.ttabs.small .ttab{font-size:13px;padding:5px 8px;color:var(--muted)}
.ttabs.small .ttab.on{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips.row::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px var(--sans);color:var(--ink);border:1px solid var(--input);border-radius:16px;padding:7px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.sale{border-color:var(--acc);color:var(--acc)}
.chip.sale.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip svg{width:12px;height:12px}

/* ---- sections (2 px ink rule + eyebrow, like NYT) ---- */
.sec{margin:26px 0 0}
.sec-head{border-top:2px solid var(--ink);padding-top:10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head .link{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.sec-head .link svg{width:11px;height:11px;vertical-align:-1px}
.sec .h-serif{margin-top:10px}
.sec .dek{margin-top:6px}
.sec.thin .sec-head{border-top-width:1px;border-top-color:var(--hair)}
.sponsored{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---- lead ---- */
.lead{margin-top:6px}
.lead-ph{position:relative;aspect-ratio:3/2;max-width:100%;background:var(--paper);overflow:hidden}
.lead-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.lead-ph img.show{opacity:1}
.lead-ph .iconbtn.onphoto{position:absolute;right:14px;bottom:14px}
.lead-ph .dots{position:absolute;left:14px;bottom:18px;display:flex;gap:6px}
.lead-ph .dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55)}
.lead-ph .dots i.on{background:#fff}
.lead-body{padding:14px 22px 0;transition:opacity .35s ease}
.lead-body.fade{opacity:0}
.lead-body .hook{font:500 14px var(--sans);color:var(--ink);margin-top:8px}
.lead-body .hook span{color:var(--acc)}
.lead-body .dek{margin-top:8px}
.lead-body .meta{margin-top:10px}

/* ---- rows + cards ---- */
.row-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:22px;scrollbar-width:none;padding:14px 22px 2px;margin:0 -22px;overscroll-behavior-x:contain}
.row-scroll::-webkit-scrollbar{display:none}
.row-scroll > *{scroll-snap-align:start}
.row-scroll::after{content:"";flex:none;width:8px}
.card{flex:none;width:236px;display:grid;gap:7px}
.card.sm{width:168px}
.card.kid{width:200px}
.card .ph{position:relative;aspect-ratio:3/2;max-width:100%;background:var(--paper);overflow:hidden;border-radius:2px}
.card .ph.sq{aspect-ratio:1/1}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .iconbtn.onphoto{position:absolute;right:8px;bottom:8px}
.card .ph .iconbtn.onphoto.fav{color:var(--acc)}
.card .title-serif{font:500 16px/1.25 var(--serif);color:var(--ink);margin:0}
.card .meta{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding-top:14px}
.grid2 .card{width:auto}
.statusline{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.statusline.ok{color:var(--acc)}
.lvl{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.lvl::before{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:currentColor;margin:0 6px 1px 0}
/* the 2nd and 3rd dots are box-shadows 9 and 18 px to the right, so the gap before the word grows with them */
.lvl.l2::before{box-shadow:9px 0 0 currentColor;margin-right:15px}
.lvl.l3::before{box-shadow:9px 0 0 currentColor,18px 0 0 currentColor;margin-right:24px}
.teaches{font:400 13px var(--sans);color:var(--muted)}
.teaches b{font-weight:600;color:var(--ink)}
.cook{padding:16px 0;border-bottom:1px solid var(--hair)}
.cook .nm{font:500 24px var(--serif);color:var(--ink)}
.cook .prog{height:3px;background:var(--hair);margin:12px 0 8px;position:relative;border-radius:2px;overflow:hidden}
.cook .prog i{position:absolute;left:0;top:0;height:100%;background:var(--acc)}
.results .grid2{padding-top:12px}
.src{font:400 12px var(--sans);color:var(--muted)}
.src b{font-weight:600;color:var(--ink)}

/* notes (article-style rows) */
.note{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--hair);width:100%}
.note:last-child{border-bottom:0}
.note .nt{flex:1;min-width:0}
.note h4{font:500 17px/1.25 var(--serif);color:var(--ink);margin:0 0 6px;text-wrap:balance}
.note .read{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note img{width:96px;aspect-ratio:3/2;object-fit:cover;border-radius:2px;flex:none;background:var(--paper)}

/* ---- product tiles ---- */
.tile{flex:none;width:132px;display:grid;gap:5px;position:relative}
.tile .pph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--paper);border:1px solid var(--hair);border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .pph img{width:82%;height:82%;object-fit:contain}
.tile.sel .pph{border:2px solid var(--acc)}
.tile .bm{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:15px;background:#fff;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tile .bm svg{width:15px;height:15px}
.tile.sel .bm{color:var(--acc);border-color:var(--acc)}
.tile .leaf{position:absolute;left:6px;top:6px;width:14px;height:14px;color:var(--ink)}
.tile .store{font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tile .nm{font:500 13px/1.25 var(--sans);color:var(--ink)}
.tile .sz{font:400 12px var(--sans);color:var(--muted)}
.tile .pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tile .pr .price{font-size:16px}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding-top:12px}
.tilegrid .tile{width:auto}
.tilegrid .tile .pph img{width:78%;height:78%}
.tile .saved{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-top:2px}

/* promoted rows */
.promo{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair);width:100%}
.promo:last-child{border-bottom:0}
.promo .pph{width:84px;height:84px;flex:none;background:var(--paper);border:1px solid var(--hair);border-radius:2px;display:flex;align-items:center;justify-content:center}
.promo .pph img{width:80%;height:80%;object-fit:contain}
.promo .pt{flex:1;min-width:0}
.promo .nm{font:600 15px/1.25 var(--sans);color:var(--ink);margin:3px 0 2px}
.promo .pairs{font:500 13px var(--sans);color:var(--acc);margin-top:4px;display:flex;align-items:center;gap:3px}
.promo .pairs svg{width:12px;height:12px}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:10px;font:600 15px var(--sans);width:100%;padding:0 18px}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-hover)}
.btn.secondary{border:1px solid var(--ink);color:var(--ink);background:transparent}
.btn.ghost{border:1px solid var(--input);color:var(--ink);background:transparent}
.btn.onink{border:1px solid rgba(255,255,255,.6);color:#fff}
.btn.sm{height:42px;font-size:14px;width:auto;padding:0 16px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:default}
.textlink{font:600 13px var(--sans);color:var(--acc)}
.inkbar{position:absolute;left:22px;right:22px;bottom:100px;z-index:7;background:var(--ink);color:#fff;border-radius:10px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:600 14px var(--sans)}
.inkbar span{color:var(--acc-tint)}
.inkbar svg{width:16px;height:16px}

/* ---- lists / rows ---- */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);width:100%}
.hrow:last-child{border-bottom:0}
.hrow .l{flex:1;min-width:0}
.hrow .n{font:500 15px/1.3 var(--sans);color:var(--ink)}
.hrow .s{font:400 13px var(--sans);color:var(--muted)}
.hrow .r{text-align:right;flex:none}
.hrow .r .price{font-size:15px}
.hrow .r .acc{color:var(--acc);font:600 13px var(--sans)}
.hrow .r .mut{color:var(--muted);font:400 13px var(--sans)}
.hrow svg.chev{width:16px;height:16px;color:var(--faint);flex:none}
.hrow .ckb{width:22px;height:22px;border:1.5px solid var(--input);border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.hrow .ckb svg{width:12px;height:12px}
.hrow.done .ckb{background:var(--ink);border-color:var(--ink)}
.hrow.done .n{color:var(--muted);text-decoration:line-through}
.storehead{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 8px;border-bottom:1px solid var(--ink)}
.storehead .sn{font:600 17px var(--serif);color:var(--ink)}
.storehead .sk{font:400 13px var(--sans);color:var(--muted);margin-left:8px}
.storehead .st{font:600 15px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.ingrow .amt{font:400 13px var(--sans);color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}

.banner{background:var(--acc);color:#fff;border-radius:10px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 6px;width:100%}
.banner .b1{font:600 16px var(--serif)}
.banner .b2{font:400 13px var(--sans);opacity:.9;margin-top:2px}
.banner svg{width:18px;height:18px;flex:none}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-top:16px}
.twocol .big{font:600 24px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.twocol .big.acc{color:var(--acc)}
.twocol .lab{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.twocol .sub{font:400 12px var(--sans);color:var(--muted);margin-top:4px}
.macros{display:flex;gap:0;padding:12px 0;border-bottom:1px solid var(--hair);font:400 13px var(--sans);color:var(--muted)}
.macros span{flex:1}
.macros b{display:block;font:600 15px var(--serif);color:var(--ink)}

/* detail hero */
.hero{position:relative;height:320px;background:var(--paper)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .iconbtn.onphoto{position:absolute;top:10px}
.hero .back{left:14px}
.hero .fav{right:14px}
.hero .fav.on{color:var(--acc)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair);font:400 15px/1.5 var(--serif);color:var(--text)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);font:600 14px var(--sans);color:var(--acc);flex:none;width:18px;padding-top:3px}

/* ---- splash / onboarding ---- */
.splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 40px;text-align:center;position:relative}
.splash .mark{width:76px;height:76px;color:var(--ink)}
.splash .wm{font:700 36px var(--serif);color:var(--ink);letter-spacing:-.01em;margin:0}
.splash .tag{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.splash .prog{width:160px;height:1px;background:var(--hair);position:relative;overflow:hidden;margin-top:28px}
.splash .prog i{position:absolute;left:0;top:0;height:100%;width:40%;background:var(--acc);animation:prog 1.6s ease-in-out infinite}
@keyframes prog{0%{left:-40%}100%{left:100%}}
.splash .ld{font:400 13px var(--sans);color:var(--muted)}
.splash .skip{position:absolute;top:8px;right:22px;font:600 13px var(--sans);color:var(--acc);padding:8px 0}
.ob{padding:8px 22px 30px;display:flex;flex-direction:column;min-height:100%}
.ob .prog{height:1px;background:var(--hair);margin:8px 0 28px;position:relative}
.ob .prog i{position:absolute;left:0;top:-0.5px;height:2px;background:var(--acc);transition:width .3s}
.ob .step{font:600 11px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.ob h1{font:500 30px/1.12 var(--serif);letter-spacing:-.01em;color:var(--ink);margin:0 0 8px;text-wrap:balance}
.ob .dek{margin-bottom:22px}
.ob .body{flex:1}
.ob .actions{display:grid;gap:10px;margin-top:26px}
.ob .back{font:600 14px var(--sans);color:var(--muted);text-align:center;padding:10px}
.tinput{width:100%;height:50px;border:1px solid var(--input);border-radius:4px;background:var(--ground);font:400 17px var(--sans);color:var(--ink);padding:0 14px;outline:none}
.tinput:focus{border-color:var(--ink)}
.tinput::placeholder{color:var(--faint)}
.hh{display:flex;gap:8px}
.hh .chip{width:48px;justify-content:center;padding:9px 0;font-weight:600}

/* ---- at the till: flyer-clipping cards the cashier can read ---- */
.tillitem{padding:16px 0;border-bottom:1px solid var(--hair)}
.tillitem:last-child{border-bottom:0}
.tillitem .ti-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.tillitem .n{font:600 18px/1.2 var(--serif);color:var(--ink)}
.tillitem .s{font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:3px}
.tillitem .s b{font-weight:600;color:var(--ink)}
.tillitem .ckb{width:28px;height:28px;border:1.5px solid var(--input);border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:2px}
.tillitem .ckb svg{width:14px;height:14px}
.tillitem .ckb.on{background:var(--ink);border-color:var(--ink)}
.tillitem.on .ad{opacity:.45}
.ad{border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.ad .ad-store{background:var(--ink);color:#fff;font:700 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:7px 12px}
.ad .ad-body{display:flex;align-items:center;gap:12px;padding:12px}
.ad .ad-body img{width:64px;height:64px;object-fit:contain;flex:none}
.ad .ad-body > div:nth-child(2){flex:1;min-width:0}
.ad .ad-name{font:600 15px/1.2 var(--sans);color:var(--ink)}
.ad .ad-size{font:400 12px var(--sans);color:var(--muted);margin-top:2px}
.ad .ad-price{font:700 30px/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.ad .ad-price span{font:600 12px var(--sans);color:var(--muted);margin-left:2px}
.ad .ad-foot{border-top:1px solid var(--hair);font:500 11px var(--sans);color:var(--muted);padding:6px 12px;letter-spacing:.02em}
.clips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px}
.clips::-webkit-scrollbar{display:none}
.clips .ad{flex:none;width:280px}
.clips .shot{flex:none;width:200px;border:1px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--paper)}
.clips .shot img{width:100%;height:150px;object-fit:cover}
.clips .shot .ad-foot{border-top:1px solid var(--hair)}
.attach{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--acc);margin-top:8px;cursor:pointer}
.attach svg{width:16px;height:16px}
.attach input{display:none}
.sendgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sendgrid .btn{height:46px;font-size:14px}
.qty{font:600 13px var(--sans);color:var(--ink);border:1px solid var(--input);border-radius:14px;padding:3px 10px;margin-right:8px;white-space:nowrap}
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:50;display:flex;align-items:center;gap:4px;background:var(--ground);border:1px solid var(--hair);border-radius:20px;padding:6px 8px 6px 14px;font:600 12px var(--sans);color:var(--muted)}
.switch button{font:600 12px var(--sans);color:var(--ink);padding:6px 10px;border-radius:14px}
.switch button.on{background:var(--ink);color:#fff}
@media (max-width:460px){.switch{bottom:92px;padding:4px 6px 4px 10px;opacity:.92}}

/* ---- colour directions (switcher on the stage) ---- */
:root{--saf:#D99A2B;--butter:#F6EDD5;--pistachio:#E8EFE2}
.theme-a .sec.band,.theme-c .sec.band{margin-left:-22px;margin-right:-22px;padding:0 22px 20px;border-radius:0}
.theme-a .sec.band-store,.theme-c .sec.band-store{background:var(--tint)}
.theme-a .sec.band-start,.theme-c .sec.band-start{background:var(--butter)}
.theme-a .sec.band-kids,.theme-c .sec.band-kids{background:var(--pistachio)}
.theme-a .sec.band .card .ph,.theme-c .sec.band .card .ph{background:rgba(255,255,255,.6)}
.theme-b .lvl,.theme-c .lvl,.theme-b .band-kids .eyebrow,.theme-c .band-kids .eyebrow,.theme-b .band-start .eyebrow,.theme-c .band-start .eyebrow{color:var(--saf)}
.theme-b .cook .prog i,.theme-c .cook .prog i{background:var(--saf)}
.theme-b .ttab.on,.theme-c .ttab.on{background:#F8EFD8}
.theme-b .results .eyebrow,.theme-c .results .eyebrow{color:var(--saf)}

/* ---- camera ---- */
.cam{height:100%;display:flex;flex-direction:column;padding:0 22px 24px;color:#fff}
.cam .vf{flex:1;position:relative;margin:14px 0;border-radius:4px;background:#241D18;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .vf .corner{position:absolute;width:40px;height:40px;border:2px solid #fff}
.cam .vf .c1{top:40px;left:40px;border-right:0;border-bottom:0}
.cam .vf .c2{top:40px;right:40px;border-left:0;border-bottom:0}
.cam .vf .c3{bottom:40px;left:40px;border-right:0;border-top:0}
.cam .vf .c4{bottom:40px;right:40px;border-left:0;border-top:0}
.cam .vf .hint{font:500 14px var(--sans);color:rgba(255,255,255,.8);text-align:center}
.cam .vf .scan{position:absolute;left:40px;right:40px;height:1px;background:var(--acc-tint);animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{top:60px}100%{top:calc(100% - 60px)}}
.cam .shutter{width:72px;height:72px;border-radius:36px;background:#fff;border:4px solid rgba(255,255,255,.4);background-clip:padding-box;margin:0 auto}
.cam .result{background:#fff;color:var(--text);border-radius:10px;padding:16px;display:grid;gap:10px}
.cam .result .top{display:flex;gap:12px;align-items:center}
.cam .result .pph{width:64px;height:64px;background:var(--paper);border:1px solid var(--hair);border-radius:2px;display:flex;align-items:center;justify-content:center;flex:none}
.cam .result .pph img{width:80%;height:80%;object-fit:contain}
.cam .quota{font:400 12px var(--sans);color:rgba(255,255,255,.7);text-align:center;margin-top:12px}
.cam .quota a{color:var(--acc-tint)}
.cam .ctitle{display:flex;align-items:center;justify-content:space-between;padding-top:4px}
.cam .ctitle .t{font:500 22px var(--serif)}

/* ---- map ---- */
.map{width:100%;aspect-ratio:346/220;border:1px solid var(--hair);border-radius:2px;background:var(--paper);margin-top:14px}
.map text{font:600 10px var(--sans)}

/* ---- plus card ---- */
.plus{background:var(--ink);color:#fff;border-radius:10px;padding:20px;margin-top:14px}
.plus .t{font:600 22px var(--serif)}
.plus .p{font:600 13px var(--sans);color:var(--acc-tint);margin:2px 0 12px}
.plus ul{margin:0 0 16px;padding:0;list-style:none;font:400 14px/1.6 var(--sans);color:rgba(255,255,255,.85)}
.plus .btn{height:46px}

/* radius */
.range{width:100%;accent-color:var(--acc);margin:8px 0}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--input);position:relative;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff}
.toggle.on{background:var(--acc)}
.toggle.on i{left:21px}

/* ---- toast ---- */
.toast{position:absolute;left:22px;right:22px;bottom:104px;z-index:9;background:var(--ink);color:#fff;border-radius:10px;padding:14px 16px;font:500 14px var(--sans);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.hi{bottom:164px}
.foot{padding:30px 22px 18px;font:400 12px var(--sans);color:var(--faint);text-align:center}
.spacer{height:70px}
@media (prefers-reduced-motion:reduce){.lead-ph img,.lead-body,.toast,.ob .prog i{transition:none}.splash .prog i,.cam .vf .scan{animation:none}}
</style>
</head>

const timeText = m => m >= 60 ? (m / 60 % 1 === 0 ? `${m / 60} hour${m > 60 ? 's' : ''}` : `${Math.floor(m / 60)}½ hours`) : `${m} min`;
const starsHTML = (n, c) => `<span class="stars" aria-label="${n} stars">${'★'.repeat(Math.round(n))}</span> <span class="meta">${c.toLocaleString()}</span>`;
function recommended(filter) {
  let list = RECIPES.filter(r => filter === 'All' || r.cuisine === filter || r.tags.includes(filter));
  return list.sort((a, b) => score(b) - score(a) || b.save - a.save);
}
const listTotal = () => S.list.reduce((a, i) => a + (BOOK[i.key] ? unitPrice(i.key, i.sid) * i.n : 0), 0);
function pmItems() { // list items at a price-matching store with a cheaper competitor ad
  return S.list.filter(i => BOOK[i.key] && STORE(i.sid) && STORE(i.sid).pm && ADS[i.key] && ADS[i.key].some(a => a.price < unitPrice(i.key, i.sid)))
    .map(i => { const best = ADS[i.key].slice().sort((a, b) => a.price - b.price)[0]; return { item: i, best, save: (unitPrice(i.key, i.sid) - best.price) * i.n }; });
}
function oneStop() {
  const within = STORES.filter(s => s.km <= U().radiusKm && s.id !== 'cc' && s.id !== 'tt');
  const priced = S.list.filter(i => BOOK[i.key]);
  const totals = within.map(s => ({ s, t: priced.reduce((a, i) => a + unitPrice(i.key, s.id) * i.n, 0) })).sort((a, b) => a.t - b.t);
  let bestPair = null;
  for (let i = 0; i < within.length; i++) for (let j = i + 1; j < within.length; j++) {
    const t = priced.reduce((a, it) => a + Math.min(unitPrice(it.key, within[i].id), unitPrice(it.key, within[j].id)) * it.n, 0);
    if (!bestPair || t < bestPair.t) bestPair = { a: within[i], b: within[j], t };
  }
  return { one: totals[0], all: totals, pair: bestPair, current: listTotal() };
}

function tcard(t) {
  const sale = t.ing.filter(k => SALE_KEYS.includes(k)).length; const have = t.ing.filter(k => inFridge(k)).length;
  return `<a class="card tcard" href="${t.url}" target="_blank" rel="noopener">
    <div class="ph"><img src="${t.img}" alt="${esc(t.name)}" loading="lazy"></div>
    <div class="eyebrow acc" style="font-size:10px">${t.why}</div>
    <h3 class="title-serif">${t.name}</h3>
    <div class="src"><b>${t.source}</b> · Open recipe ↗</div>
    <div class="statusline${sale ? ' ok' : ''}">${sale ? `${sale} ingredient${sale === 1 ? '' : 's'} on sale` : 'Priced locally'} · ${have} of ${t.ing.length} in your fridge</div>
  </a>`;
}
/* ---------- colour switcher (prototype only) + boot ---------- */
(function () {
  const THEMES = [['', 'Current'], ['theme-a', 'A · Tints'], ['theme-b', 'B · Saffron'], ['theme-c', 'C · Both']];
  let cur = LS.get('plateful_theme', '');
  const bar = document.createElement('div'); bar.className = 'switch'; bar.innerHTML = 'Colour ' + THEMES.map(([c, l]) => `<button data-theme="${c}" class="${c === cur ? 'on' : ''}">${l}</button>`).join('');
  document.body.appendChild(bar);
  const apply = c => { document.body.classList.remove('theme-a', 'theme-b', 'theme-c'); if (c) document.body.classList.add(c); bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.theme === c)); };
  apply(cur);
  bar.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; cur = b.dataset.theme; LS.set('plateful_theme', cur); apply(cur); });
})();
render();
